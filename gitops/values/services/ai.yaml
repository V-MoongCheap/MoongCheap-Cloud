nameOverride: ai

workload:
  kind: Deployment

image:
  repository: "840851421204.dkr.ecr.ap-northeast-2.amazonaws.com/moongcheap/ai"
  pullPolicy: IfNotPresent

containerPort: 8081

service:
  enabled: true
  type: ClusterIP
  port: 80
  targetPort: http

ingress:
  enabled: false

autoscaling:
  enabled: false

pdb:
  enabled: false

envFrom:
  - secretRef:
      name: ai-env

livenessProbe:
  enabled: false
  path: /health

readinessProbe:
  enabled: true
  path: /health
  initialDelaySeconds: 15
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6

nodeSelector:
  workload: backend-ai

# 임시 조치(QA·발표 기간): Karpenter consolidation이 이 Pod가 있는 노드를 정리하지 않게 한다.
# Jenkins 빌드 Pod가 be-ai 노드를 늘렸다가 줄일 때 replicas 1인 이 Pod가 축출돼 서비스가 끊겼다(D-68).
# replicas 2 + PDB가 들어가면 제거한다.
podAnnotations:
  karpenter.sh/do-not-disrupt: "true"
