nameOverride: backend

image:
  repository: "840851421204.dkr.ecr.ap-northeast-2.amazonaws.com/moongcheap/backend"

containerPort: 8080

service:
  port: 80

env:
  - name: REDIS_HOST
    value: "moongcheap-develop-redis.mzcbtb.ng.0001.apn2.cache.amazonaws.com"

  - name: REDIS_PORT
    value: "6379"

envFrom:
  - secretRef:
      name: backend-env

livenessProbe:
  enabled: false
  path: /actuator/health

readinessProbe:
  enabled: false
  path: /actuator/health

nodeSelector:
  workload: backend-ai