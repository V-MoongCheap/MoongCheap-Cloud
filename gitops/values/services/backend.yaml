nameOverride: backend

image:
  repository: "840851421204.dkr.ecr.ap-northeast-2.amazonaws.com/moongcheap/backend"

containerPort: 8080

service:
  port: 80

env:
  - name: REDIS_HOST
    value: "moongcheap-develop-redis.mzcbtb.ng.0001.apn2.cache.amazonaws.com"

  - name: REDIS_PORT
    value: "6379"

  - name: SPRING_SESSION_DATA_REDIS_CONFIGURE_ACTION
    value: "none"

envFrom:
  - secretRef:
      name: backend-env

livenessProbe:
  enabled: false
  path: /actuator/health

readinessProbe:
  enabled: true
  path: /actuator/health
  initialDelaySeconds: 90
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6

nodeSelector:
  workload: backend-ai

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi