nameOverride: backend

image:
  repository: "840851421204.dkr.ecr.ap-northeast-2.amazonaws.com/moongcheap/backend"

containerPort: 8080

service:
  port: 80

env:
  - name: REDIS_HOST
    value: "moongcheap-develop-redis.mzcbtb.ng.0001.apn2.cache.amazonaws.com"

  - name: REDIS_PORT
    value: "6379"

  # - name: SPRING_SESSION_DATA_REDIS_CONFIGURE_ACTION
  #   value: "none"

  - name: ALLOWED_ORIGINS
    value: "https://moongcheap.shop"

  - name: OAUTH_REDIRECT_BASE_URL
    value: "https://moongcheap.shop"

  - name: OPENSEARCH_HOST
    value: "vpc-moongcheap-develop-os-itmwuyj5rkawx3pebp7ftspbau.ap-northeast-2.es.amazonaws.com"

  - name: OPENSEARCH_PORT
    value: "443"

  - name: OPENSEARCH_SCHEME
    value: "https"

  # D-65: 기본값이 false라 결제 Outbox 발행·큐 워커·복구 스케줄러 3종이
  # @ConditionalOnProperty에 걸려 아예 생성되지 않는다. 공동구매 낙찰 후
  # 자동 결제가 실행되려면 켜야 한다(주문만 쌓이고 결제는 영원히 안 나감).
  - name: PAYMENT_QUEUE_ENABLED
    value: "true"

envFrom:
  - secretRef:
      name: backend-env

livenessProbe:
  enabled: false
  path: /actuator/health

readinessProbe:
  enabled: true
  path: /actuator/health
  initialDelaySeconds: 90
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6

nodeSelector:
  workload: backend-ai

# 임시 조치(QA·발표 기간): Karpenter consolidation이 이 Pod가 있는 노드를 정리하지 않게 한다.
# Jenkins 빌드 Pod가 be-ai 노드를 늘렸다가 줄일 때 replicas 1인 이 Pod가 축출돼 서비스가 끊겼다(D-68).
# replicas 2 + PDB가 들어가면 제거한다.
podAnnotations:
  karpenter.sh/do-not-disrupt: "true"

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi