apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute

metadata:
  name: backend
  namespace: moongcheap-develop

spec:
  hostnames:
    - "api.moongcheap.shop"

  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: moongcheap-gateway
      namespace: infra

  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /

      backendRefs:
        - group: ""
          kind: Service
          name: backend
          port: 80
          weight: 1