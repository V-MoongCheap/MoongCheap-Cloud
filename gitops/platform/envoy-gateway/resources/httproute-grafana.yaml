# kube-prometheus-stack 릴리스 이름이 "kube-prometheus-stack"이므로
# 서브차트 Grafana Service 이름은 "kube-prometheus-stack-grafana"가 된다
# (로컬 테스트에서 동일 패턴으로 검증 완료).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  hostnames:
    - "grafana.moongcheap.shop"
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: moongcheap-gateway
      namespace: infra
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: kube-prometheus-stack-grafana
          port: 80
          weight: 1
 