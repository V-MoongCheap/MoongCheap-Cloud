# Jenkins는 gitops/platform/jenkins의 Helm 릴리스(releaseName: jenkins)가 만드는
# jenkins 네임스페이스의 Service를 그대로 backendRef로 참조한다.
# Cloudflare Access(로그인)는 Cloudflare 대시보드에서 별도로 설정 — 코드 관리 대상 아님.
# /github-webhook/ 경로만 Access를 bypass하는 정책도 Cloudflare Access 쪽 설정이며,
# 이 HTTPRoute 자체는 경로 구분 없이 전체를 jenkins Service로 넘긴다.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: jenkins
  namespace: jenkins
spec:
  hostnames:
    - "jenkins.moongcheap.shop"
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: moongcheap-gateway
      namespace: infra
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: jenkins   # 실제 Service 이름 kubectl get svc -n jenkins 로 확인 후 다르면 수정
          port: 8080
          weight: 1