# 앞단 프록시(cloudflared) 1홉을 신뢰해 X-Forwarded-For / X-Forwarded-Proto를 보존한다.
# 없으면 Envoy가 자신을 엣지로 보고 XFP를 실제 연결 scheme(cloudflared → Envoy 구간 http)으로
# 덮어써서, backend가 OAuth2 redirect_uri·Swagger server URL을 http://로 만든다(D-80).
# 경로: Cloudflare 엣지(HTTPS, XFP=https 부여) → cloudflared → Envoy :80 → Service
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: moongcheap-client
  namespace: infra
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: moongcheap-gateway
  clientIPDetection:
    xForwardedFor:
      numTrustedHops: 1
