# gitops/platform/jenkins/values.yaml
#
# 공식 jenkinsci/helm-charts(jenkins/jenkins) 기준 values 파일입니다.
# [배포 후 기입]으로 표시된 값은 실제 AWS 계정/클러스터 정보가 나온 뒤 채워야 합니다.

controller:
  image:
    repository: "jenkins/jenkins"
    tag: "lts-jdk17"

  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2"
      memory: "4Gi"

  installPlugins:
    - kubernetes:latest
    - workflow-aggregator:latest
    - git:latest
    - github:latest
    - configuration-as-code:latest
    - credentials-binding:latest
    - pipeline-utility-steps:latest

  JCasC:
    configScripts:
      dynamic-agents: |
        jenkins:
          clouds:
            - kubernetes:
                name: "kubernetes"
                serverUrl: "https://kubernetes.default"
                namespace: "jenkins"
                jenkinsUrl: "http://jenkins.jenkins.svc.cluster.local:8080"
                containerCapStr: "10"
                podRetention: "never"
                templates:
                  - name: "node-builder"
                    label: "node-builder"
                    namespace: "jenkins"
                    serviceAccount: "jenkins-sa"
                    containers:
                      - name: "builder"
                        image: "node:20"
                        command: "cat"
                        ttyEnabled: true
                        resourceRequestCpu: "500m"
                        resourceRequestMemory: "1Gi"
                      # docker build/push 대신 이미지를 굽는 용도.
                      # Pod 안에 Docker 데몬을 띄우지 않고도 ECR에 Push 가능
                      # (root 권한 불필요, 보안상 권장되는 방식).
                      # -debug 태그 필수: 기본(distroless) 태그는 쉘이 없어서
                      # command: cat으로 컨테이너를 띄워두는 방식 자체가 동작 안 함.
                      - name: "kaniko"
                        image: "gcr.io/kaniko-project/executor:v1.23.2-debug"
                        command: "cat"
                        ttyEnabled: true
                        resourceRequestCpu: "500m"
                        resourceRequestMemory: "1Gi"
                  - name: "java-builder"
                    label: "java-builder"
                    namespace: "jenkins"
                    serviceAccount: "jenkins-sa"
                    containers:
                      - name: "builder"
                        image: "eclipse-temurin:17-jdk"
                        command: "cat"
                        ttyEnabled: true
                        resourceRequestCpu: "1"
                        resourceRequestMemory: "2Gi"
                      - name: "kaniko"
                        image: "gcr.io/kaniko-project/executor:v1.23.2-debug"
                        command: "cat"
                        ttyEnabled: true
                        resourceRequestCpu: "500m"
                        resourceRequestMemory: "1Gi"
                  - name: "python-builder"
                    label: "python-builder"
                    namespace: "jenkins"
                    serviceAccount: "jenkins-sa"
                    containers:
                      - name: "builder"
                        image: "python:3.11-slim"
                        command: "cat"
                        ttyEnabled: true
                        resourceRequestCpu: "500m"
                        resourceRequestMemory: "1Gi"
                      - name: "kaniko"
                        image: "gcr.io/kaniko-project/executor:v1.23.2-debug"
                        command: "cat"
                        ttyEnabled: true
                        resourceRequestCpu: "500m"
                        resourceRequestMemory: "1Gi"

  # ingress:
  #   enabled: true
  #   hostName: "jenkins.[배포후_도메인_기입]"
  #   annotations:
  #     kubernetes.io/ingress.class: "nginx"

  ingress:
    enabled: false

  nodeSelector:
    workload: system


# NOTE: serviceAccount/persistence는 controller: 안이 아니라 최상위 키여야
# 실제로 반영된다는 걸 helm template 검증으로 확인함 (5.9.62 기준)
serviceAccount:
  create: true
  name: jenkins-sa
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::840851421204:role/moongcheap-jenkins-role   # [배포 후 기입]

persistence:
  enabled: true
  storageClass: "gp3"
  size: "2Gi"
  # NOTE: 이 Chart는 PVC 이름을 Release 이름 기준으로 자동 생성해서
  # 네이밍 규약서상 "jenkins-home-pvc"로 직접 맞추기는 어려움 — 팀 확인 필요 항목으로 남겨둠

agent:
  enabled: false

rbac:
  create: true
