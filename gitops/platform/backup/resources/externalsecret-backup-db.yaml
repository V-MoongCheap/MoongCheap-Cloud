# pg_dump 전용 읽기 계정(backup_reader, GRANT pg_read_all_data). 마스터 계정을 쓰지 않는다.
# Secrets Manager 값 형식: {host, port, dbname, username, password}
apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
  name: rds-backup-db
  namespace: moongcheap-backup

spec:
  refreshInterval: 1h

  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore

  target:
    name: rds-backup-db
    creationPolicy: Owner

  dataFrom:
    - extract:
        key: moongcheap-develop-backup-db-secret
