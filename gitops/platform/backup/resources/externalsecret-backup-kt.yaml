# KT Object Storage 전용 API Key (버킷 moongcheap-rdsbackup).
# Secrets Manager 값 형식: {access_key_id, secret_access_key, endpoint, bucket}
apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
  name: rds-backup-kt
  namespace: moongcheap-backup

spec:
  refreshInterval: 1h

  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore

  target:
    name: rds-backup-kt
    creationPolicy: Owner

  dataFrom:
    - extract:
        key: moongcheap-develop-backup-kt-secret
