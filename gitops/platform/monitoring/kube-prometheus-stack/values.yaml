# gitops/infra/monitoring/dev/kube-prometheus-stack-values.yaml
#
# chart: prometheus-community/kube-prometheus-stack
# 릴리스 예: helm upgrade --install kube-prometheus-stack prometheus-community/kube-prometheus-stack -n monitoring -f this-file.yaml
#
# 참고: kube-state-metrics, kubelet/cAdvisor, kube-apiserver, coredns 등은
# 이 차트가 기본으로 제공하는 ServiceMonitor/scrape 설정을 통해 Prometheus가
# "직접" scrape 합니다. Alloy를 거치지 않습니다. Alloy는 딱 하나,
# "호스트 OS 메트릭(구 node_exporter)"만 대체합니다.

nodeExporter:
  enabled: false # node_exporter 서브차트 비활성화. 대신 alloy-metrics DaemonSet이 그 역할을 함

kubeStateMetrics:
  enabled: true # 유지. Prometheus가 직접 scrape (Alloy와 무관)

# 부하 테스트 대시보드의 NodePool별 노드 수 패널용. 기본값은 노드 라벨을 하나도 내보내지 않아
# kube_node_labels가 비어 있다(2026-09-29 확인). 필요한 라벨만 허용한다.
kube-state-metrics:
  metricLabelsAllowlist:
    - nodes=[karpenter.sh/nodepool,workload,node.kubernetes.io/instance-type]

prometheus:
  prometheusSpec:
    # Alloy가 remote_write로 밀어넣는 걸 받으려면 반드시 켜야 함 (기본값 false)
    enableRemoteWriteReceiver: true
    retention: 3d # 3 일간 데이터 보관 -> 추후 변경
    # 2026-09-26 실측(Prometheus 3일 max/p95) 기준 — request≈p95 올림, limit≈max×1.5~2. system 노드 메모리 고갈(NotReady) 재발 방지
    resources:
      requests:
        cpu: 250m
        memory: 768Mi   # 실측 max 774 / p95 679 (기존 512Mi)
      limits:
        memory: 1Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 30Gi
    nodeSelector:
      workload: system
    # 2026-09-28 D-88 — Prometheus와 Jenkins 컨트롤러를 같은 노드에 두지 않는다.
    # 둘 다 PVC가 2c라 2c system 노드 2대 중에서만 뜨는데, Open 직후 먼저 Ready된 한 대에
    # Jenkins·Prometheus·Loki·Grafana가 전부 몰려 request 98%·실사용 91%까지 찼다(09-26 A-95와 같은 조건).
    # preferred는 Open 직후 2c 노드가 한 대뿐일 때 무시되므로 required로 둔다 — 두 번째 2c 노드가
    # Ready될 때까지 잠깐 Pending된 뒤 분산된다. 대가: 2c system 노드가 한 대만 남으면 둘 중 하나는 Pending.
    # Grafana는 RollingUpdate + RWO PVC라 노드를 옮기면 Multi-Attach로 멈추므로 여기서 다루지 않는다.
    # ⚠️ 차트 기본값 podAntiAffinity: soft를 반드시 끈다. 차트 템플릿은 아래 affinity를 쓴 뒤
    #   같은 레벨에 podAntiAffinity 키를 한 번 더 쓰므로(YAML 중복 키 → 뒤의 것이 이김),
    #   끄지 않으면 이 규칙이 차트 기본값(Prometheus끼리 soft 분산)으로 덮여 적용되지 않는다(#134에서 발생).
    podAntiAffinity: ""
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - topologyKey: kubernetes.io/hostname
            namespaces: ["jenkins"]
            labelSelector:
              matchLabels:
                app.kubernetes.io/component: jenkins-controller
  service:
    type: ClusterIP # LoadBalancer (on-premise 테스트 시)
    
alertmanager:
  # 처음엔 꺼두고 나중에 알림 필요해지면 활성화해도 무방 (경량화 목적)
  enabled: false

grafana:
  enabled: true
  admin:
    existingSecret: grafana-admin-secret
    userKey: admin-user
    passwordKey: admin-password
  persistence:
    enabled: true
    size: 20Gi
    storageClassName: gp3
  nodeSelector:
    workload: system
  # 2026-09-26 실측(Prometheus 3일 max/p95) 기준 — request≈p95 올림, limit≈max×1.5~2. system 노드 메모리 고갈(NotReady) 재발 방지
  resources:
    requests:
      memory: 384Mi   # 실측 max 530 / p95 304
    limits:
      memory: 768Mi
  sidecar:
    resources:        # grafana-sc-dashboard·grafana-sc-datasources 실측 max 89 / 82
      requests:
        memory: 96Mi
      limits:
        memory: 192Mi
  additionalDataSources:
    - name: Loki
      type: loki
      access: proxy
      # release 이름을 "loki"로 설치했다는 가정. 실제 서비스명은
      # kubectl get svc -n monitoring 으로 확인 후 맞춰서 수정
      url: http://loki-gateway.monitoring.svc.cluster.local
      isDefault: false
  service:
    type: ClusterIP # LoadBalancer (on-premise 테스트 시)
  ingress:
    enabled: false   # TODO: Cloudflare extra_subdomains(grafana) 활성화 + ingress-nginx 배포 확인 후 true
  env:
    GF_PLUGINS_PREINSTALL_DISABLED: "true"
    TZ: "Asia/Seoul"
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: 'moongcheap'
          orgId: 1
          folder: 'MoongCheap'
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/moongcheap
  dashboards:
    moongcheap:
      k8s-pods-view:
        gnetId: 15760
        revision: 39
        datasource: Prometheus
      springboot-pods:
        gnetId: 24605
        revision: 1
        datasource: Prometheus
      loki-logs:
        gnetId: 24574
        revision: 2
        datasource: Loki
      node-exporter-full:
        gnetId: 1860
        revision: 45
        datasource: Prometheus
      # 부하 테스트 때 KEDA(트래픽 → Pod 수)·Karpenter(Pending → 노드 수)가 반응하는지 한 화면에서 본다.
      # 쿼리는 2026-09-29 develop Prometheus에서 확인. NodePool 패널은 아래 kube-state-metrics.metricLabelsAllowlist,
      # KEDA scaler 패널은 keda values의 serviceMonitor release 라벨이 반영된 뒤부터 값이 나온다.
      loadtest-traffic:
        json: |
          {
            "title": "부하 테스트 트래픽 확인",
            "uid": "moongcheap-loadtest-traffic",
            "tags": ["moongcheap", "loadtest", "keda", "karpenter"],
            "timezone": "browser",
            "refresh": "10s",
            "time": {"from": "now-30m", "to": "now"},
            "schemaVersion": 39,
            "editable": true,
            "templating": {"list": []},
            "annotations": {"list": []},
            "panels": [
              {"id": 1, "type": "row", "title": "요약 (현재 값)", "collapsed": false, "gridPos": {"x": 0, "y": 0, "w": 24, "h": 1}, "panels": []},
              {"id": 2, "type": "stat", "title": "유입 RPS", "description": "KEDA 트리거와 같은 쿼리", "datasource": {"type": "prometheus", "uid": "prometheus"}, "gridPos": {"x": 0, "y": 1, "w": 4, "h": 4}, "targets": [{"datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "sum(rate(http_server_requests_seconds_count{service=\"backend\", namespace=\"moongcheap-develop\", uri!=\"/actuator/health\"}[1m]))", "legendFormat": "RPS", "refId": "A"}], "fieldConfig": {"defaults": {"unit": "reqps"}, "overrides": []}, "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "value", "graphMode": "area"}},
              {"id": 3, "type": "stat", "title": "Pod당 RPS (목표 50)", "description": "HPA는 Pod당 평균이 50을 넘으면 늘린다. 필요 Pod 수 = ceil(RPS / 50)", "datasource": {"type": "prometheus", "uid": "prometheus"}, "gridPos": {"x": 4, "y": 1, "w": 4, "h": 4}, "targets": [{"datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "sum(rate(http_server_requests_seconds_count{service=\"backend\", namespace=\"moongcheap-develop\", uri!=\"/actuator/health\"}[1m])) / sum(kube_deployment_status_replicas_ready{namespace=\"moongcheap-develop\", deployment=\"backend\"})", "legendFormat": "per pod", "refId": "A"}], "fieldConfig": {"defaults": {"unit": "reqps", "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "orange", "value": 40}, {"color": "red", "value": 50}]}}, "overrides": []}, "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "value", "graphMode": "area"}},
              {"id": 4, "type": "stat", "title": "backend Pod (ready / desired)", "description": "min 2 · max 8", "datasource": {"type": "prometheus", "uid": "prometheus"}, "gridPos": {"x": 8, "y": 1, "w": 4, "h": 4}, "targets": [{"datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "sum(kube_deployment_status_replicas_ready{namespace=\"moongcheap-develop\", deployment=\"backend\"})", "legendFormat": "ready", "refId": "A"}, {"datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "sum(kube_horizontalpodautoscaler_status_desired_replicas{namespace=\"moongcheap-develop\", horizontalpodautoscaler=\"keda-hpa-backend\"})", "legendFormat": "desired", "refId": "B"}], "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []}, "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "value", "graphMode": "area"}},
              {"id": 5, "type": "stat", "title": "Pending Pod", "description": "0보다 크면 노드가 모자라 Karpenter가 노드를 만들어야 하는 상태", "datasource": {"type": "prometheus", "uid": "prometheus"}, "gridPos": {"x": 12, "y": 1, "w": 4, "h": 4}, "targets": [{"datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "sum(kube_pod_status_phase{namespace=\"moongcheap-develop\", phase=\"Pending\"}) or vector(0)", "legendFormat": "pending", "refId": "A"}], "fieldConfig": {"defaults": {"unit": "short", "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "orange", "value": 1}]}}, "overrides": []}, "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "value", "graphMode": "area"}},
              {"id": 6, "type": "stat", "title": "노드 수 (be-ai / 전체)", "description": "", "datasource": {"type": "prometheus", "uid": "prometheus"}, "gridPos": {"x": 16, "y": 1, "w": 4, "h": 4}, "targets": [{"datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "count(kube_node_labels{label_karpenter_sh_nodepool=\"be-ai\"}) or vector(0)", "legendFormat": "be-ai", "refId": "A"}, {"datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "count(kube_node_info)", "legendFormat": "전체", "refId": "B"}], "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []}, "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "value", "graphMode": "area"}},
              {"id": 7, "type": "stat", "title": "5xx 비율", "description": "", "datasource": {"type": "prometheus", "uid": "prometheus"}, "gridPos": {"x": 20, "y": 1, "w": 4, "h": 4}, "targets": [{"datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "(sum(rate(http_server_requests_seconds_count{service=\"backend\", namespace=\"moongcheap-develop\", status=~\"5..\"}[1m])) or vector(0)) / sum(rate(http_server_requests_seconds_count{service=\"backend\", namespace=\"moongcheap-develop\", uri!=\"/actuator/health\"}[1m]))", "legendFormat": "5xx", "refId": "A"}], "fieldConfig": {"defaults": {"unit": "percentunit", "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "orange", "value": 0.01}, {"color": "red", "value": 0.05}]}}, "overrides": []}, "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "value", "graphMode": "area"}},
              {"id": 8, "type": "row", "title": "KEDA — 트래픽 → Pod 수", "collapsed": false, "gridPos": {"x": 0, "y": 5, "w": 24, "h": 1}, "panels": []},
              {"id": 9, "type": "timeseries", "title": "유입 RPS와 Pod당 RPS", "description": "Pod당 RPS가 점선(50)을 넘으면 KEDA가 Pod를 늘린다", "datasource": {"type": "prometheus", "uid": "prometheus"}, "gridPos": {"x": 0, "y": 6, "w": 12, "h": 8}, "targets": [{"datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "sum(rate(http_server_requests_seconds_count{service=\"backend\", namespace=\"moongcheap-develop\", uri!=\"/actuator/health\"}[1m]))", "legendFormat": "전체 RPS", "refId": "A"}, {"datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "sum(rate(http_server_requests_seconds_count{service=\"backend\", namespace=\"moongcheap-develop\", uri!=\"/actuator/health\"}[1m])) / sum(kube_deployment_status_replicas_ready{namespace=\"moongcheap-develop\", deployment=\"backend\"})", "legendFormat": "Pod당 RPS", "refId": "B"}], "fieldConfig": {"defaults": {"unit": "reqps", "custom": {"lineWidth": 2, "fillOpacity": 10, "showPoints": "never", "thresholdsStyle": {"mode": "dashed"}}, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "red", "value": 50}]}}, "overrides": []}, "options": {"legend": {"displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull", "max"]}, "tooltip": {"mode": "multi", "sort": "desc"}}},
              {"id": 10, "type": "timeseries", "title": "backend Pod 수 (HPA desired / current / ready)", "description": "desired가 먼저 오르고 ready가 뒤따른다. 둘의 간격 = Pod 기동 시간(+ 노드 준비 시간)", "datasource": {"type": "prometheus", "uid": "prometheus"}, "gridPos": {"x": 12, "y": 6, "w": 12, "h": 8}, "targets": [{"datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "kube_horizontalpodautoscaler_status_desired_replicas{namespace=\"moongcheap-develop\", horizontalpodautoscaler=\"keda-hpa-backend\"}", "legendFormat": "desired (HPA 판단)", "refId": "A"}, {"datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "kube_horizontalpodautoscaler_status_current_replicas{namespace=\"moongcheap-develop\", horizontalpodautoscaler=\"keda-hpa-backend\"}", "legendFormat": "current", "refId": "B"}, {"datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "kube_deployment_status_replicas_ready{namespace=\"moongcheap-develop\", deployment=\"backend\"}", "legendFormat": "ready", "refId": "C"}, {"datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "kube_horizontalpodautoscaler_spec_max_replicas{namespace=\"moongcheap-develop\", horizontalpodautoscaler=\"keda-hpa-backend\"}", "legendFormat": "max", "refId": "D"}], "fieldConfig": {"defaults": {"unit": "short", "custom": {"lineWidth": 2, "fillOpacity": 10, "showPoints": "never"}}, "overrides": []}, "options": {"legend": {"displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull", "max"]}, "tooltip": {"mode": "multi", "sort": "desc"}}},
              {"id": 11, "type": "timeseries", "title": "KEDA scaler 값 (Prometheus 트리거가 읽은 값)", "description": "KEDA operator 메트릭. ServiceMonitor에 release 라벨이 붙은 뒤부터 수집된다", "datasource": {"type": "prometheus", "uid": "prometheus"}, "gridPos": {"x": 0, "y": 14, "w": 12, "h": 7}, "targets": [{"datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "keda_scaler_metrics_value{namespace=\"moongcheap-develop\", scaledObject=\"backend\"}", "legendFormat": "scaler 값", "refId": "A"}, {"datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "keda_scaler_active{namespace=\"moongcheap-develop\", scaledObject=\"backend\"}", "legendFormat": "active", "refId": "B"}], "fieldConfig": {"defaults": {"unit": "short", "custom": {"lineWidth": 2, "fillOpacity": 10, "showPoints": "never"}}, "overrides": []}, "options": {"legend": {"displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull", "max"]}, "tooltip": {"mode": "multi", "sort": "desc"}}},
              {"id": 12, "type": "timeseries", "title": "KEDA scaler 에러", "description": "0이 아니면 KEDA가 Prometheus 쿼리를 못 읽는 중 — 스케일링이 멈춘다", "datasource": {"type": "prometheus", "uid": "prometheus"}, "gridPos": {"x": 12, "y": 14, "w": 12, "h": 7}, "targets": [{"datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "sum by (scaledObject) (rate(keda_scaler_detail_errors_total{namespace=\"moongcheap-develop\"}[5m]))", "legendFormat": "__auto", "refId": "A"}], "fieldConfig": {"defaults": {"unit": "short", "custom": {"lineWidth": 2, "fillOpacity": 10, "showPoints": "never"}}, "overrides": []}, "options": {"legend": {"displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull", "max"]}, "tooltip": {"mode": "multi", "sort": "desc"}}},
              {"id": 13, "type": "row", "title": "Karpenter — Pod 부족 → 노드 수", "collapsed": false, "gridPos": {"x": 0, "y": 21, "w": 24, "h": 1}, "panels": []},
              {"id": 14, "type": "timeseries", "title": "Pending Pod", "description": "Pending이 생긴 시각과 아래 노드 수가 오른 시각의 차이 = 노드 준비 시간", "datasource": {"type": "prometheus", "uid": "prometheus"}, "gridPos": {"x": 0, "y": 22, "w": 8, "h": 8}, "targets": [{"datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "sum(kube_pod_status_phase{namespace=\"moongcheap-develop\", phase=\"Pending\"}) or vector(0)", "legendFormat": "Pending", "refId": "A"}], "fieldConfig": {"defaults": {"unit": "short", "custom": {"lineWidth": 2, "fillOpacity": 10, "showPoints": "never"}}, "overrides": []}, "options": {"legend": {"displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull", "max"]}, "tooltip": {"mode": "multi", "sort": "desc"}}},
              {"id": 15, "type": "timeseries", "title": "NodePool별 노드 수", "description": "kube-state-metrics metricLabelsAllowlist(nodes=karpenter.sh/nodepool)로 수집", "datasource": {"type": "prometheus", "uid": "prometheus"}, "gridPos": {"x": 8, "y": 22, "w": 8, "h": 8}, "targets": [{"datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "count by (label_karpenter_sh_nodepool) (kube_node_labels{label_karpenter_sh_nodepool!=\"\"})", "legendFormat": "__auto", "refId": "A"}, {"datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "count(kube_node_info)", "legendFormat": "전체", "refId": "B"}], "fieldConfig": {"defaults": {"unit": "short", "custom": {"lineWidth": 2, "fillOpacity": 10, "showPoints": "never"}}, "overrides": []}, "options": {"legend": {"displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull", "max"]}, "tooltip": {"mode": "multi", "sort": "desc"}}},
              {"id": 16, "type": "timeseries", "title": "노드별 backend Pod 수", "description": "새 노드에 Pod가 올라가는지", "datasource": {"type": "prometheus", "uid": "prometheus"}, "gridPos": {"x": 16, "y": 22, "w": 8, "h": 8}, "targets": [{"datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "count by (node) (kube_pod_info{namespace=\"moongcheap-develop\", pod=~\"backend-.*\", created_by_kind=\"ReplicaSet\"})", "legendFormat": "__auto", "refId": "A"}], "fieldConfig": {"defaults": {"unit": "short", "custom": {"lineWidth": 2, "fillOpacity": 10, "showPoints": "never"}}, "overrides": []}, "options": {"legend": {"displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull", "max"]}, "tooltip": {"mode": "multi", "sort": "desc"}}},
              {"id": 17, "type": "row", "title": "backend 응답", "collapsed": false, "gridPos": {"x": 0, "y": 30, "w": 24, "h": 1}, "panels": []},
              {"id": 18, "type": "timeseries", "title": "응답 시간 p50 / p95 / p99", "description": "", "datasource": {"type": "prometheus", "uid": "prometheus"}, "gridPos": {"x": 0, "y": 31, "w": 12, "h": 8}, "targets": [{"datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "histogram_quantile(0.50, sum by (le) (rate(http_server_requests_seconds_bucket{service=\"backend\", namespace=\"moongcheap-develop\", uri!=\"/actuator/health\"}[1m])))", "legendFormat": "p50", "refId": "A"}, {"datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket{service=\"backend\", namespace=\"moongcheap-develop\", uri!=\"/actuator/health\"}[1m])))", "legendFormat": "p95", "refId": "B"}, {"datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "histogram_quantile(0.99, sum by (le) (rate(http_server_requests_seconds_bucket{service=\"backend\", namespace=\"moongcheap-develop\", uri!=\"/actuator/health\"}[1m])))", "legendFormat": "p99", "refId": "C"}], "fieldConfig": {"defaults": {"unit": "s", "custom": {"lineWidth": 2, "fillOpacity": 10, "showPoints": "never"}}, "overrides": []}, "options": {"legend": {"displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull", "max"]}, "tooltip": {"mode": "multi", "sort": "desc"}}},
              {"id": 19, "type": "timeseries", "title": "상태 코드별 RPS", "description": "Cloudflare 엣지에서 막힌 요청(403/429)은 여기 안 잡힌다 — k6 cf_blocked로 따로 본다", "datasource": {"type": "prometheus", "uid": "prometheus"}, "gridPos": {"x": 12, "y": 31, "w": 12, "h": 8}, "targets": [{"datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "sum by (status) (rate(http_server_requests_seconds_count{service=\"backend\", namespace=\"moongcheap-develop\", uri!=\"/actuator/health\"}[1m]))", "legendFormat": "__auto", "refId": "A"}], "fieldConfig": {"defaults": {"unit": "reqps", "custom": {"lineWidth": 2, "fillOpacity": 10, "showPoints": "never"}}, "overrides": []}, "options": {"legend": {"displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull", "max"]}, "tooltip": {"mode": "multi", "sort": "desc"}}},
