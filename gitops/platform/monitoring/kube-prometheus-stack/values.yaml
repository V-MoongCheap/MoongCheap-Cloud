# gitops/infra/monitoring/dev/kube-prometheus-stack-values.yaml
#
# chart: prometheus-community/kube-prometheus-stack
# 릴리스 예: helm upgrade --install kube-prometheus-stack prometheus-community/kube-prometheus-stack -n monitoring -f this-file.yaml
#
# 참고: kube-state-metrics, kubelet/cAdvisor, kube-apiserver, coredns 등은
# 이 차트가 기본으로 제공하는 ServiceMonitor/scrape 설정을 통해 Prometheus가
# "직접" scrape 합니다. Alloy를 거치지 않습니다. Alloy는 딱 하나,
# "호스트 OS 메트릭(구 node_exporter)"만 대체합니다.

nodeExporter:
  enabled: false # node_exporter 서브차트 비활성화. 대신 alloy-metrics DaemonSet이 그 역할을 함

kubeStateMetrics:
  enabled: true # 유지. Prometheus가 직접 scrape (Alloy와 무관)

prometheus:
  prometheusSpec:
    # Alloy가 remote_write로 밀어넣는 걸 받으려면 반드시 켜야 함 (기본값 false)
    enableRemoteWriteReceiver: true
    retention: 3d # 3 일간 데이터 보관 -> 추후 변경
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        memory: 1Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi
    nodeSelector:
      workload: backend-ai    
  service:
    type: ClusterIP # LoadBalancer (on-premise 테스트 시)
    
alertmanager:
  # 처음엔 꺼두고 나중에 알림 필요해지면 활성화해도 무방 (경량화 목적)
  enabled: false

grafana:
  enabled: true
  adminPassword: CHANGE_ME # 실제로는 sealed-secret / external-secret 등으로 주입 예정
  persistence:
    enabled: true
    size: 5Gi
    storageClassName: gp3
  nodeSelector:
    workload: backend-ai
  additionalDataSources:
    - name: Loki
      type: loki
      access: proxy
      # release 이름을 "loki"로 설치했다는 가정. 실제 서비스명은
      # kubectl get svc -n monitoring 으로 확인 후 맞춰서 수정
      url: http://loki-gateway.monitoring.svc.cluster.local
      isDefault: false
  service:
    type: ClusterIP # LoadBalancer (on-premise 테스트 시)
  env:
    GF_PLUGINS_PREINSTALL_DISABLED: "true"
    TZ: "Asia/Seoul"
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: 'moongcheap'
          orgId: 1
          folder: 'MoongCheap'
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/moongcheap
  dashboards:
    moongcheap:
      k8s-pods-view:
        gnetId: 15760
        revision: 39
        datasource: Prometheus
      springboot-pods:
        gnetId: 24605
        revision: 1
        datasource: Prometheus
      loki-logs:
        gnetId: 24574
        revision: 2
        datasource: Loki
      node-exporter-full:
        gnetId: 1860
        revision: 45
        datasource: Prometheus


  # 알림 링크(Source/Silence)가 실제 접속 주소로 나가게 함
  grafana.ini:
    server:
      root_url: https://grafana.moongcheap.shop/
  envFromSecret: grafana-env-secret # k8s 시크릿 등록 필요

  alerting:
    templates.yaml:
      apiVersion: 1
    templates.yaml:
      apiVersion: 1
      templates:
        - orgId: 1
          name: moongcheap-discord
          template: |
            {{ `{{` }} define `moongcheap.title` {{ `}}` }}
            {{ `{{` }} if eq .Status `firing` {{ `}}` }}🔴 [FIRING:{{ `{{` }} len .Alerts.Firing {{ `}}` }}]{{ `{{` }} else {{ `}}` }}✅ [RESOLVED]{{ `{{` }} end {{ `}}` }} MoongCheap 알림
            {{ `{{` }} end {{ `}}` }}

            {{ `{{` }} define `moongcheap.message` {{ `}}` }}
            {{ `{{` }} range .Alerts.Firing {{ `}}` }}
            🔴 **{{ `{{` }} .Labels.alertname {{ `}}` }}** (심각도: {{ `{{` }} .Labels.severity {{ `}}` }})
            {{ `{{` }} .Annotations.summary {{ `}}` }}
            발생: {{ `{{` }} .StartsAt.Local.Format `2006-01-02 15:04:05` {{ `}}` }} KST
            상세보기: {{ `{{` }} .GeneratorURL {{ `}}` }}

            {{ `{{` }} end {{ `}}` }}
            {{ `{{` }} range .Alerts.Resolved {{ `}}` }}
            ✅ **{{ `{{` }} .Labels.alertname {{ `}}` }}** 복구됨 ({{ `{{` }} .StartsAt.Local.Format `15:04:05` {{ `}}` }} ~ {{ `{{` }} .EndsAt.Local.Format `15:04:05` {{ `}}` }} KST)

            {{ `{{` }} end {{ `}}` }}
            {{ `{{` }} end {{ `}}` }}

    contactpoints.yaml:
      apiVersion: 1
      contactPoints:
        - orgId: 1
          name: discord-webhook
          receivers:
            - uid: discord-contact-1
              type: discord
              settings:
                url: $__env{DISCORD_WEBHOOK_URL}
                use_discord_username: true
                title: '{{ `{{` }} template `moongcheap.title` . {{ `}}` }}'
                message: '{{ `{{` }} template `moongcheap.message` . {{ `}}` }}'

    policies.yaml:
      apiVersion: 1
      policies:
        - orgId: 1
          receiver: discord-webhook
          group_by: ['alertname']
          group_wait: 30s
          group_interval: 5m # 같은 alertname으로 최근에 알림이 나갔으면 5분 텀을 두고 나간다 (알림 스팸 방지용)
          repeat_interval: 4h

    rules.yaml:
      apiVersion: 1
      groups:
        - orgId: 1
          name: moongcheap-alerts
          folder: MoongCheap
          interval: 1m
          rules:

            - uid: pod-crashloopbackoff
              title: "Pod CrashLoopBackOff"
              condition: C
              noDataState: OK   # 크래시루프 파드가 없으면 데이터가 원래 없는 게 정상
              for: 5m
              labels:
                severity: critical
              annotations:
                summary: '{{ `{{` }} $labels.namespace {{ `}}` }}/{{ `{{` }} $labels.pod {{ `}}` }} CrashLoopBackOff'
              data:
                - refId: A
                  relativeTimeRange: { from: 300, to: 0 }
                  datasourceUid: prometheus
                  model:
                    expr: kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"} == 1
                    instant: true
                    refId: A
                - refId: C
                  datasourceUid: __expr__
                  model:
                    type: threshold
                    expression: A
                    conditions:
                      - evaluator: { type: gt, params: [0] }
                    refId: C

            - uid: node-not-ready
              title: "Node NotReady"
              condition: C
              for: 5m
              labels:
                severity: critical
              annotations:
                summary: 'Node {{ `{{` }} $labels.node {{ `}}` }} is NotReady'
              data:
                - refId: A
                  relativeTimeRange: { from: 300, to: 0 }
                  datasourceUid: prometheus
                  model:
                    expr: kube_node_status_condition{condition="Ready", status="true"}
                    instant: true
                    refId: A
                - refId: C
                  datasourceUid: __expr__
                  model:
                    type: threshold
                    expression: A
                    conditions:
                      - evaluator: { type: lt, params: [1] }
                    refId: C

            - uid: host-cpu-high
              title: "CPU 사용률 임계치 초과"
              condition: C
              for: 10m
              labels:
                severity: warning
              annotations:
                summary: '{{ `{{` }} $labels.instance {{ `}}` }} CPU 사용률 80% 초과'
              data:
                - refId: A
                  relativeTimeRange: { from: 300, to: 0 }
                  datasourceUid: prometheus
                  model:
                    expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)
                    instant: true
                    refId: A
                - refId: C
                  datasourceUid: __expr__
                  model:
                    type: threshold
                    expression: A
                    conditions:
                      - evaluator: { type: gt, params: [80] }
                    refId: C

            - uid: host-mem-high
              title: "메모리 사용률 임계치 초과"
              condition: C
              for: 10m
              labels:
                severity: warning
              annotations:
                summary: '{{ `{{` }} $labels.instance {{ `}}` }} 메모리 사용률 80% 초과'
              data:
                - refId: A
                  relativeTimeRange: { from: 300, to: 0 }
                  datasourceUid: prometheus
                  model:
                    expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100
                    instant: true
                    refId: A
                - refId: C
                  datasourceUid: __expr__
                  model:
                    type: threshold
                    expression: A
                    conditions:
                      - evaluator: { type: gt, params: [80] }
                    refId: C

            - uid: pvc-usage-high
              title: "PVC 사용량 임계치 초과"
              condition: C
              for: 10m
              labels:
                severity: warning
              annotations:
                summary: 'PVC {{ `{{` }} $labels.namespace {{ `}}` }}/{{ `{{` }} $labels.persistentvolumeclaim {{ `}}` }} 사용량 80% 초과'
              data:
                - refId: A
                  relativeTimeRange: { from: 300, to: 0 }
                  datasourceUid: prometheus
                  model:
                    expr: (kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes) * 100
                    instant: true
                    refId: A
                - refId: C
                  datasourceUid: __expr__
                  model:
                    type: threshold
                    expression: A
                    conditions:
                      - evaluator: { type: gt, params: [80] }
                    refId: C