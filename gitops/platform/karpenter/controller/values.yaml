serviceAccount:
  create: true
  name: karpenter
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::840851421204:role/moongcheap-develop-karpenter-controller-role"

settings:
  clusterName: moongcheap-develop-eks
  interruptionQueue: ""

controller:
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 1
      memory: 1Gi

  nodeSelector:
    workload: system