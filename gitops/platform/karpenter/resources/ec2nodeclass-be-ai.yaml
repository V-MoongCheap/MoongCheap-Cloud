apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass

metadata:
  name: be-ai

spec:
  amiSelectorTerms:
    - alias: al2023@latest

  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: moongcheap-develop-eks

  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: moongcheap-develop-eks

  instanceProfile: "moongcheap-develop-karpenter-node-profile"

  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeType: gp3
        volumeSize: 20Gi
        encrypted: true
        deleteOnTermination: true

  tags:
    Name: moongcheap-develop-karpenter-node
    Environment: develop
    ManagedBy: karpenter