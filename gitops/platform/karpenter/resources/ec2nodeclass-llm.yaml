# LLM worker 노드용 EC2NodeClass. be-ai와 같은 Subnet·SG·Instance Profile을 쓰고
# 모델 파일·이미지 용량 때문에 Root Volume만 50Gi로 키운다.
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass

metadata:
  name: llm

spec:
  amiSelectorTerms:
    - alias: al2023@latest

  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: moongcheap-develop-eks

  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: moongcheap-develop-eks

  instanceProfile: "moongcheap-develop-karpenter-node-profile"

  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeType: gp3
        volumeSize: 50Gi
        encrypted: true
        deleteOnTermination: true

  tags:
    Name: moongcheap-develop-karpenter-llm-node
    Environment: develop
    ManagedBy: karpenter
