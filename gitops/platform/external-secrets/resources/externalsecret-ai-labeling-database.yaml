apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
  name: ai-labeling-database
  namespace: moongcheap-develop

spec:
  refreshInterval: 1h

  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore

  target:
    name: ai-labeling-database
    creationPolicy: Owner

    template:
      engineVersion: v2

      data:
        url: 'postgresql://{{ .username | urlquery }}:{{ .password | urlquery }}@{{ .host }}:{{ .port }}/{{ .dbname }}'

  dataFrom:
    - extract:
        key: moongcheap-develop-db-secret