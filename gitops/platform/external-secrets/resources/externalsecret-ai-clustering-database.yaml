apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
  name: ai-clustering-database
  namespace: moongcheap-develop

spec:
  refreshInterval: 1h

  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore

  target:
    name: ai-clustering-database
    creationPolicy: Owner

    template:
      engineVersion: v2

      data:
        DB_URL: "jdbc:postgresql://{{ .host }}:{{ .port }}/{{ .dbname }}"
        DB_USERNAME: "{{ .username }}"
        DB_PASSWORD: "{{ .password }}"

  dataFrom:
    - extract:
        key: moongcheap-develop-ai-clustering-db-secret
        