apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
  name: backend-env
  namespace: moongcheap-develop

spec:
  refreshInterval: 1h

  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore

  target:
    name: backend-env
    creationPolicy: Owner

    template:
      engineVersion: v2
      data:
        DB_URL: "jdbc:postgresql://{{ .host }}:{{ .port }}/{{ .dbname }}"
        DB_USERNAME: "{{ .username }}"
        DB_PASSWORD: "{{ .password }}"

        KAKAO_CLIENT_ID: "{{ .KAKAO_CLIENT_ID }}"
        KAKAO_CLIENT_SECRET: "{{ .KAKAO_CLIENT_SECRET }}"
        KAKAO_ADMIN_KEY: "{{ .KAKAO_ADMIN_KEY }}"
        GOOGLE_CLIENT_ID: "{{ .GOOGLE_CLIENT_ID }}"
        GOOGLE_CLIENT_SECRET: "{{ .GOOGLE_CLIENT_SECRET }}"

        TOSS_BRANDPAY_CLIENT_KEY: "{{ .TOSS_BRANDPAY_CLIENT_KEY }}"
        TOSS_BRANDPAY_SECRET_KEY: "{{ .TOSS_BRANDPAY_SECRET_KEY }}"
        TOSS_BRANDPAY_SECURITY_KEY: "{{ .TOSS_BRANDPAY_SECURITY_KEY }}"

        MOONGCHEAP_ENC_PASSWORD: "{{ .MOONGCHEAP_ENC_PASSWORD }}"
        MOONGCHEAP_ENC_SALT: "{{ .MOONGCHEAP_ENC_SALT }}"
        MOONGCHEAP_INTERNAL_API_KEY: "{{ .MOONGCHEAP_INTERNAL_API_KEY }}"
        SELLER_ANALYSIS_INTERNAL_KEY: "{{ .SELLER_ANALYSIS_INTERNAL_KEY }}"

        OPENSEARCH_USERNAME: "{{ .opensearch_username }}"
        OPENSEARCH_PASSWORD: "{{ .opensearch_password }}"

  # OpenSearch 마스터 계정은 dataFrom.extract를 쓰지 않는다 —
  # opensearch-secret의 키가 db-secret과 똑같이 username/password라
  # extract로 합치면 서로 덮어쓴다. property로 명시해 별칭을 붙인다.
  data:
    - secretKey: opensearch_username
      remoteRef:
        key: moongcheap-develop-opensearch-secret
        property: username
    - secretKey: opensearch_password
      remoteRef:
        key: moongcheap-develop-opensearch-secret
        property: password

  dataFrom:
    - extract:
        key: moongcheap-develop-db-secret

    - extract:
        key: moongcheap-develop-be-oauth-secret