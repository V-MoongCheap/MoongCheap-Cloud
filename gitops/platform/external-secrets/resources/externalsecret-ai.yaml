apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
  name: ai-env
  namespace: moongcheap-develop

spec:
  refreshInterval: 1h

  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore

  target:
    name: ai-env
    creationPolicy: Owner

    template:
      engineVersion: v2
      data:
        BACKEND_INTERNAL_API_KEY: "{{ .MOONGCHEAP_INTERNAL_API_KEY  }}"
        SELLER_ANALYSIS_INTERNAL_KEY: "{{ .SELLER_ANALYSIS_INTERNAL_KEY }}"
        
  dataFrom:
    - extract:
        key: moongcheap-develop-be-oauth-secret