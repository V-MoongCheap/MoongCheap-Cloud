# gitops/infra/monitoring/dev/alloy-logs-values.yaml
#
# chart: grafana/alloy
# 릴리스 예: helm upgrade --install alloy-logs grafana/alloy -n monitoring -f this-file.yaml
#
# 역할: 노드마다 1개씩 떠서(DaemonSet) 그 노드에서 도는 파드들의 로그를
# Kubernetes API를 통해 tail(promtail처럼 /var/log/pods 를 직접 마운트해서 읽는 방식이 아님)
# 해서 Loki로 push. Promtail의 역할을 그대로 대체.
service:
  type: LoadBalancer
  
controller:
  type: daemonset

alloy:
  configMap:
    content: |
      // 이 노드에 있는 파드만 대상으로 삼는다 (데몬셋 전체가 같은 파드를 중복으로 보지 않도록)
      discovery.kubernetes "pods" {
        role = "pod"
        selectors {
          role  = "pod"
          field = "spec.nodeName=" + coalesce(sys.env("HOSTNAME"), constants.hostname)
        }
      }

      discovery.relabel "pod_logs" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          target_label  = "app"
        }
      }

      loki.source.kubernetes "pod_logs" {
        targets    = discovery.relabel.pod_logs.output
        forward_to = [loki.process.pod_logs.receiver]
      }

      loki.process "pod_logs" {
        stage.static_labels {
          values = {
            cluster = "dev-eks",
          }
        }
        forward_to = [loki.write.default.receiver]
      }

      loki.write "default" {
        endpoint {
          url = "http://loki-gateway.monitoring.svc.cluster.local/loki/api/v1/push"
          // 서비스명은 loki 릴리스 이름에 따라 달라짐. kubectl get svc -n monitoring 으로 확인
        }
      }

# 참고: loki.source.kubernetes 는 kubelet 로그 API를 통해 로그를 읽어오기 때문에
# 파드에 pods, pods/log 에 대한 get/list/watch 권한이 필요합니다.
# rbac.create: true (기본값) 로 대부분 커버되지만, 로그가 안 들어오면
# 생성된 ClusterRole에 pods/log 권한이 있는지 가장 먼저 확인하세요.
