apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backend-env
  namespace: moongcheap-develop

spec:
  refreshInterval: 1h

  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore

  target:
    name: backend-env
    creationPolicy: Owner

  dataFrom:
    - extract:
        key: moongcheap-develop-db-secret