apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: backup-resources
  namespace: argocd

spec:
  project: moongcheap-platform

  source:
    repoURL: https://github.com/V-MoongCheap/MoongCheap-Cloud.git
    targetRevision: develop
    path: gitops/platform/backup/resources

  destination:
    server: https://kubernetes.default.svc
    namespace: moongcheap-backup

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - ServerSideApply=true
