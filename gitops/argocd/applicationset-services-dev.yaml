apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: moongcheap-services-dev
  namespace: argocd

spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error

  generators:
    - list:
        elements:
          - service: frontend
          - service: backend
          - service: ai

  template:
    metadata:
      name: "moongcheap-{{ .service }}-dev"

    spec:
      project: moongcheap-services

      sources:
        - repoURL: https://github.com/V-MoongCheap/MoongCheap-Cloud.git
          targetRevision: develop
          path: gitops/charts/moongcheap-service
          helm:
            releaseName: "{{ .service }}"
            valueFiles:
              - $values/gitops/values/base.yaml
              - $values/gitops/values/env/dev.yaml
              - $values/gitops/values/services/{{ .service }}.yaml
              - $values/gitops/values/overrides/dev/{{ .service }}.yaml

        - repoURL: https://github.com/V-MoongCheap/MoongCheap-Cloud.git
          targetRevision: develop
          ref: values

      destination:
        server: https://kubernetes.default.svc
        namespace: moongcheap-dev

      syncPolicy:
        automated:
          prune: true
          selfHeal: true

        syncOptions:
          - CreateNamespace=true
