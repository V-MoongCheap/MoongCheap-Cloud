apiVersion: argoproj.io/v1alpha1
kind: AppProject

metadata:
  name: moongcheap-platform
  namespace: argocd

spec:
  description: MoongCheap platform components

  sourceRepos:
    - https://github.com/V-MoongCheap/MoongCheap-Cloud.git
    - https://prometheus-community.github.io/helm-charts
    - https://grafana.github.io/helm-charts
    - https://charts.jenkins.io
    - public.ecr.aws/karpenter
    - docker.io/envoyproxy
    - https://charts.external-secrets.io
    
  destinations:
    - server: https://kubernetes.default.svc
      namespace: monitoring
    - server: https://kubernetes.default.svc
      namespace: kube-system
    - server: https://kubernetes.default.svc
      namespace: jenkins
    - server: https://kubernetes.default.svc
      namespace: infra
    - server: https://kubernetes.default.svc
      namespace: argocd
    - server: https://kubernetes.default.svc
      namespace: kube-node-lease
    - server: https://kubernetes.default.svc
      namespace: "moongcheap-*"
      
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"

  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"