{{- if eq .Values.workload.kind "CronJob" }}
apiVersion: batch/v1
kind: CronJob

metadata:
  name: {{ include "moongcheap-service.fullname" . }}-job
  labels:
    {{- include "moongcheap-service.labels" . | nindent 4 }}
    app.kubernetes.io/component: batch

spec:
  schedule: {{ .Values.cronjob.schedule | quote }}
  timeZone: {{ .Values.cronjob.timeZone | quote }}
  suspend: {{ .Values.cronjob.suspend }}
  concurrencyPolicy: {{ .Values.cronjob.concurrencyPolicy }}

  startingDeadlineSeconds: {{ .Values.cronjob.startingDeadlineSeconds }}
  successfulJobsHistoryLimit: {{ .Values.cronjob.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.cronjob.failedJobsHistoryLimit }}

  jobTemplate:
    spec:
      backoffLimit: {{ .Values.cronjob.backoffLimit }}
      activeDeadlineSeconds: {{ .Values.cronjob.activeDeadlineSeconds }}
      ttlSecondsAfterFinished: {{ .Values.cronjob.ttlSecondsAfterFinished }}

      template:
        metadata:
          labels:
            {{- include "moongcheap-service.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: batch

            {{- with .Values.podLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}

          {{- with .Values.podAnnotations }}
          annotations:
            {{- toYaml . | nindent 12 }}
          {{- end }}

        spec:
          serviceAccountName: {{ .Values.cronjob.serviceAccountName }}
          automountServiceAccountToken: false
          restartPolicy: Never

          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}

          {{- with .Values.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}

          {{- with .Values.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}

          {{- with .Values.affinity }}
          affinity:
            {{- toYaml . | nindent 12 }}
          {{- end }}

          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault

          containers:
            - name: {{ include "moongcheap-service.name" . }}

              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}

              {{- with .Values.cronjob.command }}
              command:
                {{- toYaml . | nindent 16 }}
              {{- end }}

              envFrom:
                - configMapRef:
                    name: {{ .Values.cronjob.configMapName }}

                {{- with .Values.envFrom }}
                {{- toYaml . | nindent 16 }}
                {{- end }}

              {{- with .Values.env }}
              env:
                {{- toYaml . | nindent 16 }}
              {{- end }}

              resources:
                {{- toYaml .Values.resources | nindent 16 }}

              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL

              volumeMounts:
                - name: tmp
                  mountPath: /tmp

          volumes:
            - name: tmp
              emptyDir:
                sizeLimit: 256Mi
{{- end }}